<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pengajuan Sewa | KostKita</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a class="logo" href="index.html">Kost<span>Kita</span></a>
        <nav class="navlinks">
          <a href="index.html">Beranda</a><a href="cari-kost.html">Cari Kost</a
          ><a href="tentang-kami.html">Tentang Kami</a
          ><a href="bantuan.html">Bantuan</a
          ><a class="btn outline" href="login.html">Masuk</a>
        </nav>
      </div>
    </header>
    <main>
      <section class="container">
        <div class="form-wrap">
          <div class="form-card">
            <span class="eyebrow">Langkah penyewaan</span>
            <h1>Form Pengajuan Sewa</h1>
            <p class="muted">
              Lengkapi informasi berikut untuk mengajukan penyewaan kost.
            </p>
            <form id="rentForm">
              <div class="field">
                <label>Nama lengkap</label
                ><input required placeholder="Nama penyewa" />
              </div>
              <div class="field">
                <label>Nomor HP</label
                ><input required type="tel" placeholder="08xxxxxxxxxx" />
              </div>
              <div class="field">
                <label>Kost yang dipilih</label
                ><input value="Kost Melati Residence" readonly />
              </div>
              <div class="field">
                <label>Tanggal mulai sewa</label><input type="date" required />
              </div>
              <div class="field">
                <label>Durasi sewa</label
                ><select>
                  <option>1 bulan</option>
                  <option>3 bulan</option>
                  <option>6 bulan</option>
                  <option>12 bulan</option>
                </select>
              </div>
              <button class="btn" style="width: 100%">
                Lanjut ke Pembayaran
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="container footer-row">
        <div>
          <div class="logo" style="color: white">Kost<span>Kita</span></div>
          <p class="small">Temukan tempat tinggal nyaman dekat kampus.</p>
        </div>
        <div class="small">
          © 2026 KostKita · Website pencarian kost mahasiswa
        </div>
      </div>
    </footer>
    <script src="js/app.js"></script>
  </body>
</html>
